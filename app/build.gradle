plugins { id 'com.android.application' }
android {
    namespace 'fr.ibiza.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'fr.ibiza.launcher'
        minSdk 23
        targetSdk 34
        versionCode 23
        versionName '2.1'
    }
    // Signature : crée ta propre clé (Android Studio > Build > Generate Signed Bundle / APK) et renseigne-la dans
    // keystore.properties (non versionné) : storeFile=..., storePassword=..., keyAlias=..., keyPassword=...
    def ksFile = rootProject.file('keystore.properties')
    def ks = new Properties(); if (ksFile.exists()) ks.load(new FileInputStream(ksFile))
    signingConfigs {
        rel { if (ksFile.exists()) { storeFile file(ks['storeFile']); storePassword ks['storePassword']; keyAlias ks['keyAlias']; keyPassword ks['keyPassword'] } }
    }
    buildTypes {
        release { minifyEnabled false; if (ksFile.exists()) signingConfig signingConfigs.rel }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false; checkReleaseBuilds false }
    aaptOptions { noCompress 'webp', 'woff2', 'jpg' }
}
