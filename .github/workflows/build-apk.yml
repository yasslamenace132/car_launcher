# Compile l'APK gratuitement sur GitHub à chaque envoi.
# Le fichier car-launcher.apk est publié dans la page « Releases » du dépôt (version « Dernière version »),
# téléchargeable directement depuis un téléphone, sans zip à décompresser.
name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Le SDK Android est déjà installé sur les machines GitHub (ANDROID_HOME) : pas d'étape d'installation.
      - name: Compiler
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk car-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: car-launcher-apk
          path: car-launcher.apk
      - name: Publier dans « Dernière version »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          CODE=$(grep -o "versionCode [0-9]*" app/build.gradle | cut -d" " -f2)
          # lu par le lanceur (Réglages > Mises à jour) pour savoir s'il existe une version plus récente
          printf '{"versionCode": %s, "versionName": "%s"}\n' "$CODE" "$VER" > version.json
          NOTES="Version $VER, compilée le $(date -u +'%d/%m/%Y à %H:%M') UTC. Télécharge car-launcher.apk et installe-le par-dessus l'ancien, ou utilise Réglages > Mises à jour dans le lanceur."
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version car-launcher.apk version.json --title "Dernière version ($VER)" --notes "$NOTES" --target "$GITHUB_SHA" --latest
